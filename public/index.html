<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OLIMPIADAS DE HISTORIA - Botonera</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
        }
        .container { max-width: 1200px; width: 100%; }
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        .header h1 { font-size: 3.5em; margin-bottom: 5px; }


        /* Pregunta en pantalla */
        .pregunta-display {
            background: #1a1a2e;
            border: 4px solid #667eea;
            border-radius: 15px;
            padding: 25px 35px;
            margin-bottom: 25px;
            text-align: center;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .pregunta-texto {
            color: white;
            font-size: 1.8em;
            font-weight: bold;
            line-height: 1.3;
        }
        .pregunta-vacia { color: #555; font-size: 1.2em; }
        .badge-boton {
            display: inline-block;
            margin-top: 12px;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: bold;
        }
        .badge-abierto { background: #22c55e; color: white; }
        .badge-cerrado { background: #ef4444; color: white; }

        /* Pantalla principal turno */
        .pantalla-principal {
            background: #1a1a2e;
            border: 8px solid #ffd700;
            border-radius: 20px;
            padding: 50px 40px;
            margin-bottom: 25px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .turno-label { color: #aaa; font-size: 0.9em; margin-bottom: 20px; }
        .circulo-turno {
            width: 200px;
            height: 200px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            margin: 0 auto 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: pulse 2s infinite;
            box-shadow: 0 0 40px rgba(102, 126, 234, 0.6);
        }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
        .nombre-turno { color: white; font-size: 2.5em; font-weight: bold; }

        .columnas { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .panel { background: #2a2a3e; border-radius: 15px; padding: 20px; color: white; }
        .panel h2 { color: #ffd700; margin-bottom: 15px; }
        .cola-item {
            background: #3a3a4e;
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .posicion {
            background: #667eea;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            flex-shrink: 0;
        }
        .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .stat-box { background: #3a3a4e; padding: 15px; border-radius: 8px; text-align: center; }
        .stat-numero { color: #ffd700; font-size: 2em; font-weight: bold; }
        .stat-label { color: #aaa; font-size: 0.9em; margin-top: 5px; }
.vacio { color: #666; text-align: center; padding: 20px; }
        .estado { position: fixed; top: 20px; right: 20px; background: rgba(0,0,0,0.7); color: white; padding: 10px 15px; border-radius: 5px; }
        .conectado { background: rgba(34, 197, 94, 0.8); }
    </style>
</head>
<body>
    <div class="container">
        <div class="estado conectado" id="estado">Conectando...</div>

        <div class="header">
            <h1>OLIMPIADAS DE HISTORIA</h1>
            <p style="color: white;">Botonera</p>
        </div>

        <!-- Pregunta visible en pantalla -->
        <div class="pregunta-display" id="preguntaDisplay">
            <div>
                <div class="pregunta-vacia" id="preguntaTexto">Sin pregunta activa</div>
                <div id="badgeBoton"></div>
            </div>
        </div>

        <!-- Turno actual -->
        <div class="pantalla-principal">
            <div class="turno-label">TURNO ACTUAL</div>
            <div class="circulo-turno">
                <div class="nombre-turno" id="nombreTurno">Esperando...</div>
            </div>
        </div>

        <div class="columnas">
            <div class="panel">
                <h2>📋 Cola de Espera</h2>
                <div id="cola"><p class="vacio">No hay nadie</p></div>
            </div>
            <div class="panel">
                <h2>📊 Estadísticas</h2>
                <div class="stats">
                    <div class="stat-box">
                        <div class="stat-numero" id="totalPresiones">0</div>
                        <div class="stat-label">Total Presiones</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-numero" id="totalTurnos">0</div>
                        <div class="stat-label">Turnos</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="panel">
            <h2>📜 Historial</h2>
            <div id="historial"><p class="vacio">Sin historial</p></div>
        </div>

    </div>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script>
        const socket = io();

        socket.on('estado-inicial', actualizarUI);
        socket.on('estado-actualizado', actualizarUI);
        socket.on('connect', () => {
            document.getElementById('estado').textContent = 'Conectado';
            document.getElementById('estado').className = 'estado conectado';
        });

        function actualizarUI(estado) {
            // Pregunta
            const preguntaEl = document.getElementById('preguntaTexto');
            if (estado.pregunta) {
                preguntaEl.textContent = estado.pregunta;
                preguntaEl.className = 'pregunta-texto';
            } else {
                preguntaEl.textContent = 'Sin pregunta activa';
                preguntaEl.className = 'pregunta-vacia';
            }

            // Badge estado botón
            const badge = document.getElementById('badgeBoton');
            if (estado.pregunta) {
                badge.innerHTML = estado.botonHabilitado
                    ? '<span class="badge-boton badge-abierto">🟢 Botones abiertos</span>'
                    : '<span class="badge-boton badge-cerrado">🔴 Botones cerrados</span>';
            } else {
                badge.innerHTML = '';
            }

            // Turno actual
            const nombreTurno = document.getElementById('nombreTurno');
            nombreTurno.textContent = estado.turnoActual ? estado.turnoActual.nombre : 'Esperando...';

            // Cola
            const colaEl = document.getElementById('cola');
            if (estado.cola.length === 0) {
                colaEl.innerHTML = '<p class="vacio">No hay nadie</p>';
            } else {
                colaEl.innerHTML = estado.cola.map((nombre, i) =>
                    `<div class="cola-item">
                        <div class="posicion">${i + 1}</div>
                        <span>${nombre}</span>
                    </div>`
                ).join('');
            }

            // Estadísticas
            document.getElementById('totalPresiones').textContent = estado.totalPresiones;
            document.getElementById('totalTurnos').textContent = estado.totalTurnos;

            // Historial
            const historialEl = document.getElementById('historial');
            if (estado.historial.length === 0) {
                historialEl.innerHTML = '<p class="vacio">Sin historial</p>';
            } else {
                historialEl.innerHTML = [...estado.historial].reverse().slice(0, 20).map(h =>
                    `<div class="cola-item">
                        <span style="color:#ffd700">${h.timestamp}</span>
                        <span><strong>${h.participante}</strong> — ${h.accion}</span>
                    </div>`
                ).join('');
            }
        }

    </script>
</body>
</html>
