<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>OLIMPIADAS DE HISTORIA - Botonera</title>
    <link rel="manifest" href="/manifest-mobile.json">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Botonera">
    <link rel="apple-touch-icon" href="/icon.svg">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            color: white;
        }

        /* Overlay de registro */
        .overlay-registro {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 30px 20px;
        }
        .overlay-registro.oculto { display: none; }
        .registro-card {
            background: #2a2a3e;
            border-radius: 20px;
            padding: 40px 30px;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .registro-card h1 { font-size: 1.5em; color: #ffd700; margin-bottom: 6px; }
        .registro-card h2 { font-size: 1em; color: #aaa; font-weight: normal; margin-bottom: 30px; }
        .registro-card label {
            display: block;
            text-align: left;
            font-size: 0.85em;
            color: #aaa;
            margin-bottom: 8px;
        }
        .registro-card input {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: 2px solid #444;
            background: #1a1a2e;
            color: white;
            font-size: 1.1em;
            text-align: center;
            margin-bottom: 12px;
        }
        .registro-card input:focus { outline: none; border-color: #667eea; }
        .btn-registrar {
            width: 100%;
            padding: 14px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-registrar:hover { background: #4f5fd5; }
        .btn-registrar:disabled { background: #444; cursor: not-allowed; }
        .error-msg {
            background: #7f1d1d;
            border: 1px solid #ef4444;
            color: #fca5a5;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.9em;
            margin-bottom: 12px;
            display: none;
        }
        .error-msg.visible { display: block; }

        /* Pantalla principal */
        .container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            gap: 10px;
        }
        .header { text-align: center; padding: 10px; }
        .header h1 { font-size: 1.6em; }
        .header p { font-size: 0.85em; color: #aaa; }
        .header .equipo-badge {
            display: inline-block;
            margin-top: 6px;
            background: #667eea;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: bold;
        }
        .pregunta-box {
            background: #0f3460;
            border: 2px solid #667eea;
            border-radius: 15px;
            padding: 15px 20px;
            text-align: center;
        }
        .pregunta-box p { font-size: 0.75em; color: #aaa; margin-bottom: 6px; }
        .pregunta-box h2 { font-size: 1.15em; font-weight: bold; line-height: 1.3; }
        .turno-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
        }
        .turno-box p { font-size: 0.8em; color: #ddd; }
        .turno-box h2 { font-size: 1.8em; font-weight: bold; }
        .boton-principal {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .boton {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a3f 100%);
            color: white;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(255, 107, 107, 0.4);
            transition: all 0.2s;
        }
        .boton:active { transform: scale(0.92); }
        .boton:disabled { background: #444; box-shadow: none; opacity: 0.6; cursor: not-allowed; }
        .mensaje {
            text-align: center;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn { from { transform: translateY(-15px); opacity: 0; } }
        .exito { background: #22c55e; }
        .footer {
            background: #2a2a3e;
            border-radius: 10px;
            padding: 10px;
            font-size: 0.8em;
            text-align: center;
            color: #999;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .dot.on { background: #22c55e; }
        .dot.off { background: #ef4444; }
    </style>
</head>
<body>

    <!-- Overlay de registro -->
    <div class="overlay-registro" id="overlayRegistro">
        <div class="registro-card">
            <h1>OLIMPIADAS DE HISTORIA</h1>
            <h2>Botonera — Registro de equipo</h2>
            <label for="inputNombre">Nombre del equipo</label>
            <div class="error-msg" id="errorRegistro"></div>
            <input type="text" id="inputNombre" placeholder="Ej: Equipo 1" maxlength="40" autocomplete="off" />
            <button class="btn-registrar" id="btnRegistrar" onclick="intentarRegistro()">Registrarse</button>
        </div>
    </div>

    <!-- Pantalla principal -->
    <div class="container">
        <div class="header">
            <h1>OLIMPIADAS DE HISTORIA</h1>
            <p>Botonera</p>
            <span class="equipo-badge" id="equipo"></span>
        </div>

        <div class="pregunta-box">
            <p>Pregunta / Tema:</p>
            <h2 id="preguntaTexto">Esperando pregunta...</h2>
        </div>

        <div class="turno-box">
            <p>Turno actual:</p>
            <h2 id="turno">-</h2>
        </div>

        <div id="mensaje"></div>

        <div class="boton-principal">
            <button class="boton" id="boton" disabled>ESPERANDO...</button>
        </div>

        <div class="footer" style="flex-direction:column; gap:4px;">
            <div style="display:flex; align-items:center; gap:6px;">
                <div class="dot" id="conexion"></div>
                <span id="estado">Conectando...</span>
            </div>
            <span style="font-size:0.72em; color:#555;">© 2026 Erwin Cortez · Docente de Tecnología y Pensamiento Computacional · Taller de Programación y Robótica</span>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script>
        const socket = io();
        let nombreEquipo = null;
        let puedePresionar = true;
        let estadoActual = {};

        // ── Registro ──────────────────────────────────────────
        const inputNombre = document.getElementById('inputNombre');
        const errorRegistro = document.getElementById('errorRegistro');
        const btnRegistrar = document.getElementById('btnRegistrar');

        // Pre-fill con nombre previo si existe
        const nombreGuardado = localStorage.getItem('nombreEquipo');
        if (nombreGuardado) inputNombre.value = nombreGuardado;

        inputNombre.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') intentarRegistro();
        });

        function intentarRegistro() {
            const nombre = inputNombre.value.trim();
            if (!nombre) {
                mostrarError('Escribe el nombre de tu equipo.');
                return;
            }
            btnRegistrar.disabled = true;
            btnRegistrar.textContent = 'Registrando...';
            socket.emit('registrar-nombre', { nombre });
        }

        socket.on('registro-resultado', (data) => {
            if (data.ok) {
                nombreEquipo = data.nombre;
                localStorage.setItem('nombreEquipo', nombreEquipo);
                document.getElementById('equipo').textContent = '👥 ' + nombreEquipo;
                document.getElementById('overlayRegistro').classList.add('oculto');
                // Actualizar UI con estado actual que ya tenemos
                actualizarEstado(estadoActual);
            } else {
                mostrarError(data.mensaje);
                btnRegistrar.disabled = false;
                btnRegistrar.textContent = 'Registrarse';
            }
        });

        function mostrarError(msg) {
            errorRegistro.textContent = msg;
            errorRegistro.classList.add('visible');
        }

        // ── Conexión ──────────────────────────────────────────
        socket.on('connect', () => {
            document.getElementById('estado').textContent = 'Conectado';
            document.getElementById('conexion').className = 'dot on';
            // Si ya estaba registrado, re-registrar automáticamente
            if (nombreEquipo) {
                socket.emit('registrar-nombre', { nombre: nombreEquipo });
            }
        });

        socket.on('disconnect', () => {
            document.getElementById('estado').textContent = 'Desconectado';
            document.getElementById('conexion').className = 'dot off';
            document.getElementById('boton').disabled = true;
            document.getElementById('boton').textContent = 'ESPERANDO...';
        });

        // ── Estado ────────────────────────────────────────────
        socket.on('estado-inicial', actualizarEstado);
        socket.on('estado-actualizado', actualizarEstado);

        function actualizarEstado(data) {
            estadoActual = data;
            if (!nombreEquipo) return; // no actualizar UI hasta estar registrado

            const pregEl = document.getElementById('preguntaTexto');
            pregEl.textContent = data.pregunta || 'Esperando pregunta...';

            const turnoEl = document.getElementById('turno');
            if (data.turnoActual) {
                turnoEl.textContent = data.turnoActual.nombre === nombreEquipo ? '¡ES TU TURNO!' : data.turnoActual.nombre;
            } else {
                turnoEl.textContent = '-';
            }

            const boton = document.getElementById('boton');
            const conectado = document.getElementById('estado').textContent === 'Conectado';
            boton.disabled = !conectado || !data.botonHabilitado;
            boton.textContent = data.botonHabilitado ? 'PRESIONA' : 'ESPERANDO...';
        }

        // ── Botón ─────────────────────────────────────────────
        document.getElementById('boton').addEventListener('click', () => {
            if (!puedePresionar || !nombreEquipo) return;
            puedePresionar = false;
            socket.emit('presionar-boton');
            mostrarMensaje('✓ Presión registrada', 'exito');
            setTimeout(() => { puedePresionar = true; }, 2000);
        });

        function mostrarMensaje(texto, tipo) {
            const div = document.getElementById('mensaje');
            div.textContent = texto;
            div.className = 'mensaje ' + tipo;
            setTimeout(() => { div.textContent = ''; div.className = ''; }, 2000);
        }
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
        }
    </script>
</body>
</html>
